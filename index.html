
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя первая VR-комната</title>
<script src="./aframe.min.js"></script>
<script>
AFRAME.registerComponent('fit-furniture', {
  schema: { axis: {default: 'y'}, size: {default: 1} },
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      model.updateMatrixWorld(true);
      let bounds = new THREE.Box3().setFromObject(model);
      const dimensions = new THREE.Vector3(); bounds.getSize(dimensions);
      const dimension = dimensions[this.data.axis];
      if (!dimension || !Number.isFinite(dimension)) return;
      model.scale.multiplyScalar(this.data.size / dimension);
      model.updateMatrixWorld(true); bounds.setFromObject(model);
      const origin = new THREE.Vector3(); this.el.object3D.getWorldPosition(origin);
      const center = new THREE.Vector3(); bounds.getCenter(center);
      const offset = new THREE.Vector3(origin.x-center.x, origin.y-bounds.min.y, origin.z-center.z);
      const inverse = new THREE.Quaternion(); this.el.object3D.getWorldQuaternion(inverse).invert();
      offset.applyQuaternion(inverse); model.position.add(offset);
    }, {once:true});
  }
});
</script>
</head>
<body>
  <a-scene background="color: #181b22"
           renderer="antialias: true">

    <!-- Освещение -->
    <a-light type="ambient" color="#d2bb9b"
             intensity="0.8"></a-light>
    <a-light type="point" position="0 2.7 0"
             intensity="18" distance="9"
             decay="2" color="#ffe5bb"></a-light>

    <!-- Пол -->
    <a-box position="0 -0.1 0"
           width="5" height="0.2" depth="5"
           color="#302017"></a-box>

    <!-- Стены -->
    <a-box position="0 1.5 -2.5"
           width="5" height="3" depth="0.15"
           material="src: url(./wallpaper-victorian.svg); repeat: 4 2; roughness: 1"></a-box>
    <a-box position="-2.5 1.5 0"
           width="0.15" height="3" depth="5"
           material="src: url(./wallpaper-victorian.svg); repeat: 4 2; roughness: 1"></a-box>
    <a-box position="2.5 1.5 0"
           width="0.15" height="3" depth="5"
           material="src: url(./wallpaper-victorian.svg); repeat: 4 2; roughness: 1"></a-box>
    <a-box position="0 1.5 2.5"
           width="5" height="3" depth="0.15"
           material="src: url(./wallpaper-victorian.svg); repeat: 4 2; roughness: 1; side: double"></a-box>

    <!-- Потолок -->
    <a-box position="0 3.05 0"
           width="5" height="0.1" depth="5"
           color="#c1b099"
           material="side: double"></a-box>

    <!-- Викторианский потолочный фонарь, модель Poly Haven (CC0). -->
    <a-gltf-model id="chandelier" src="./polyhaven-lantern-chandelier-01.glb"
                  position="0 2.96 0" scale="0.75 0.75 0.75"></a-gltf-model>

    <!-- Кресло: встроенные текстуры, исходный масштаб в метрах.
         Нижняя точка GLB: y = -0.0004315; поднимаем её до уровня пола. -->
    <a-gltf-model id="armchair"
                  src="./polyhaven-armchair-01.glb"
                  position="0 0.0004315 -1.2"
                  rotation="0 0 0"
                  scale="1 1 1">
    </a-gltf-model>

    <!-- Кабинет: тёмное дерево, латунь и книги -->
    <a-entity id="office-furnishings"></a-entity>
    <!-- Предметы, выбранные пользователем: локальные GLB. -->
    <a-entity position="-1.28 0 -1.55" rotation="0 90 0"><a-gltf-model id="real-desk" src="./victorian-desk.glb" fit-furniture="axis: y; size: 0.76"></a-gltf-model></a-entity>
    <a-gltf-model id="real-globe" src="./floor-globe.glb" position="1.65 0 -1.6" fit-furniture="axis: y; size: 1.25"></a-gltf-model>
    <a-gltf-model id="real-books" src="./old-books.glb" position="-1.72 0.77 -1.55" fit-furniture="axis: x; size: 0.40"></a-gltf-model>
    <a-gltf-model id="real-phone" src="./vintage-telephone.glb" position="-0.92 0.77 -1.4" fit-furniture="axis: y; size: 0.18"></a-gltf-model>
    <a-gltf-model id="real-telescope" src="./brass-telescope.glb" position="1.75 0 1.45" fit-furniture="axis: y; size: 1.45"></a-gltf-model>

    <!-- Игрок и VR-камера -->
    <a-entity id="player"
              position="0 0 1.2"
              movement-controls="speed: 0.12">
      <a-camera look-controls
                wasd-controls="acceleration: 15"
                position="0 1.6 0">
      </a-camera>
      <a-entity laser-controls="hand: left"
          id="left-hand"></a-entity>
      <a-entity laser-controls="hand: right"
          id="right-hand"></a-entity>
    </a-entity>

  </a-scene>
  <script>
// Небольшие предметы кабинета строятся локально, без внешних загрузок.
(function () {
  const root = document.querySelector('#office-furnishings');
  function box(parent, pos, size, color) {
    const e = document.createElement('a-box');
    e.setAttribute('position', pos); e.setAttribute('width', size[0]);
    e.setAttribute('height', size[1]); e.setAttribute('depth', size[2]);
    e.setAttribute('color', color); parent.appendChild(e); return e;
  }
  function entity(pos, rotation) { const e=document.createElement('a-entity'); e.setAttribute('position',pos); if(rotation)e.setAttribute('rotation',rotation); root.appendChild(e); return e; }
  // Деревянные панели и декоративные молдинги вдоль стен.
  for (const [x,z,rot] of [[0,-2.405,0],[0,2.405,180],[-2.405,0,90],[2.405,0,-90]]) {
    const w=entity(`${x} 0 ${z}`,`0 ${rot} 0`);
    box(w,'0 0.48 0',[4.8,.96,.07],'#392318');
    for (const y of [.08,.88,1.02,2.86]) box(w,`0 ${y} .055`,[4.8,.045,.075],'#704a2a');
    for (let n=-2;n<=2;n++) {box(w,`${n*.9} .48 .055`,[.045,.78,.08],'#78512d');}
  }
  // Книги на шкафах: корешки разных цветов, золотые полосы.
  const colors=['#512829','#293e33','#493124','#3e3039','#2f3c49','#674a30'];
  for (const [x,rot] of [[-2.20,90],[2.20,-90]]) {
    const shelf=entity(`${x} 0 .35`,`0 ${rot} 0`);
    box(shelf,'0 1.15 0',[1.85,2.3,.38],'#3b2117');
    box(shelf,'0 2.34 0',[1.96,.12,.46],'#7c532f');
    for(const y of [.25,.70,1.15,1.60,2.05]) {
      box(shelf,`0 ${y} .02`,[1.8,.045,.42],'#79502c');
      if(y===2.05)continue;
      for(let i=0;i<14;i++){const h=.24+(i%4)*.028;const x1=-.78+i*.12; box(shelf,`${x1} ${y+.03+h/2} .12`,[.102,h,.19],colors[(i+Math.round(y*10))%colors.length]);box(shelf,`${x1} ${y+.12} .225`,[.085,.009,.006],'#bd9857');}
    }
  }
  // Ковёр с каймой.
  box(root,'0 .012 .15',[2.35,.018,2.2],'#692d2c');
  box(root,'0 .023 .15',[2.13,.008,1.98],'#b18a50');
  box(root,'0 .029 .15',[1.99,.006,1.84],'#702e30');
  // Рамка, латунный светильник и бумаги на столе.
  const art=entity('.8 0 -2.40');box(art,'0 1.9 .02',[1.05,.8,.075],'#a27b3d');box(art,'0 1.9 .07',[.91,.66,.025],'#302b25');box(art,'0 1.9 .09',[.80,.56,.01],'#786955');

})();

AFRAME.registerComponent('thumbstick-movement', {
  init: function () {
    this.axisX = 0;
    this.axisY = 0;

    const leftHand = document.querySelector('#left-hand');

    leftHand.addEventListener('thumbstickmoved', (event) => {
      this.axisX = event.detail.x;
      this.axisY = event.detail.y;
    });
  },
  
  tick: function (time, delta) {
    if (!this.el.sceneEl.is('vr-mode')) return;

    const deadzone = 0.15;
    const x = Math.abs(this.axisX) > deadzone ? this.axisX : 0;
    const y = Math.abs(this.axisY) > deadzone ? this.axisY : 0;

    if (x === 0 && y === 0) return;

    const player = document.querySelector('#player');
    const camera = player.querySelector('[camera]');

    const direction = new THREE.Vector3(x, 0, y);
    const rotation = new THREE.Quaternion();

    camera.object3D.getWorldQuaternion(rotation);
    direction.applyQuaternion(rotation);
    direction.y = 0;
    direction.normalize();

    const speed = 1.5;
    const seconds = Math.min(delta / 1000, 0.05);

    player.object3D.position.addScaledVector(
      direction,
      speed * seconds
    );
  }
});

document.querySelector('#player')
  .setAttribute('thumbstick-movement', '');
     AFRAME.registerComponent('snap-turn', {
  init: function () {
    this.ready = true;

    const rightHand = document.querySelector('#right-hand');
    rightHand.addEventListener('thumbstickmoved', (event) => {
      const x = event.detail.x;

      if (Math.abs(x) < 0.3) {
        this.ready = true;
        return;
      }

      if (!this.ready || Math.abs(x) < 0.75) return;

      this.ready = false;

      const angle = x > 0 ? -Math.PI / 6 : Math.PI / 6;
      this.el.object3D.rotation.y += angle;
    });
  }
});

document.querySelector('#player')
  .setAttribute('snap-turn', '');
</script>

</body>
</html>
