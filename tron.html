<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тёмная VR-галерея</title>
<script src="./aframe.min.js"></script>
<script>
// ---------------------------------------------------------------
// Список предметов галереи. Чтобы добавить предмет, добавьте строку.
//   src   – файл GLB рядом с этой страницей
//   pos   – позиция [x, y, z] в метрах (y = 0 это пол)
//   rot   – поворот по вертикали в градусах (0 = лицом к +z, к игроку на старте)
//   fit   – [ось, размер в метрах]: подогнать размер и поставить на пол
//   scale – масштаб по осям [x, y, z] (для шкафа сжимаем глубину)
//   inst  – true: один файл загружается один раз и копируется (экономит память Quest)
//   pool  – световое пятно на полу [цвет, радиус]
// ---------------------------------------------------------------
const WARM = '#ffb070', CYAN = '#d9a77a';
const GALLERY = [
  // Кресло в центре: главный ориентир, к нему лицом стоит игрок.
  {id:'armchair', src:'polyhaven-armchair-01.glb', pos:[0, 0.0004315, -1.5], pool:[WARM, 1.5]},
  {id:'chandelier', src:'polyhaven-lantern-chandelier-01.glb', pos:[0, 3.1, -1.5], scale:[.75,.75,.75]},

  // Глобус справа и телескоп.
  {id:'globe', src:'floor-globe-quest.glb', pos:[3.3, 0, -2.0], pool:[WARM, 1.0]},
  {id:'telescope', src:'brass-telescope.glb', pos:[4.3, 0, 1.3], rot:-60, fit:['y', 1.45], pool:[WARM, 1.0]},

  // Шкаф из 4 видов (Multi-view): стоит ровно, без перекоса, глубина натуральная.
  {id:'cab-mv', src:'victorian-cabinet-mv-quest.glb', pos:[-4.5, 0, -4.0], rot:90, pool:[WARM, 1.6]},

  // Напольные часы (сгенерированы по фото; стекло и циферблат перерисованы, глубина сжата до 0,4 м).
  {id:'clock', src:'grandfather-clock-quest.glb', pos:[2.4, 0, -7.6], rot:0, scale:[1,1,.6], pool:[WARM, 1.2]},

  // Комод из 4 видов (Multi-view), оптимизирован до 60 тысяч граней, высота 0,85 м.
  {id:'komod', src:'komod-quest.glb', pos:[5, 0, -3], rot:0, pool:[WARM, 1.0]},
];

AFRAME.registerComponent('fit-furniture', {
  schema: { axis: {default: 'y'}, size: {default: 1} },
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      model.updateMatrixWorld(true);
      let bounds = new THREE.Box3().setFromObject(model);
      const dimensions = new THREE.Vector3(); bounds.getSize(dimensions);
      const dimension = dimensions[this.data.axis];
      if (!dimension || !Number.isFinite(dimension)) return;
      model.scale.multiplyScalar(this.data.size / dimension);
      model.updateMatrixWorld(true); bounds.setFromObject(model);
      const origin = new THREE.Vector3(); this.el.object3D.getWorldPosition(origin);
      const center = new THREE.Vector3(); bounds.getCenter(center);
      const offset = new THREE.Vector3(origin.x-center.x, origin.y-bounds.min.y, origin.z-center.z);
      const inverse = new THREE.Quaternion(); this.el.object3D.getWorldQuaternion(inverse).invert();
      offset.applyQuaternion(inverse); model.position.add(offset);
    }, {once:true});
  }
});

// Один GLB загружается один раз, дальше копии делят геометрию и текстуры.
AFRAME.registerComponent('instance-glb', {
  schema: { src: {type: 'string'} },
  init: function () {
    const cache = (window.__glbCache = window.__glbCache || {});
    const src = this.data.src;
    if (!cache[src]) cache[src] = new Promise((ok, fail) => new THREE.GLTFLoader().load(src, ok, undefined, fail));
    cache[src].then(gltf => {
      this.el.setObject3D('mesh', gltf.scene.clone(true));
      this.el.emit('model-loaded');
    }).catch(e => console.error('instance-glb failed', src, e));
  }
});

// Пол: тёмная сетка, исчезающая в тумане.
AFRAME.registerComponent('grid-floor', {
  schema: { radius: {default: 40}, cell: {default: 5} },
  init: function () {
    const size = 512, cells = 5, c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = '#4a4c52'; g.fillRect(0, 0, size, size);
    const step = size / cells;
    g.strokeStyle = 'rgba(212,160,120,0.45)'; g.lineWidth = 2;
    for (let i = 1; i < cells; i++) {
      g.beginPath(); g.moveTo(i*step, 0); g.lineTo(i*step, size); g.stroke();
      g.beginPath(); g.moveTo(0, i*step); g.lineTo(size, i*step); g.stroke();
    }
    g.strokeStyle = 'rgba(222,168,128,0.7)'; g.lineWidth = 5;
    g.strokeRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(this.data.radius * 2 / this.data.cell, this.data.radius * 2 / this.data.cell);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(this.data.radius, 64),
      new THREE.MeshStandardMaterial({map: tex, roughness: 1, metalness: 0}));
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    mesh.position.y = 0.05; // чуть выше среза планеты, чтобы не мерцало
    this.el.setObject3D('mesh', mesh);
  }
});

// Световое пятно на полу под предметом.
AFRAME.registerComponent('glow-pool', {
  schema: { color: {default: '#d9a77a'}, radius: {default: 1.5}, opacity: {default: 0.5} },
  init: function () {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.45, 'rgba(255,255,255,0.35)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(this.data.radius, 32),
      new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(c), color: '#000000', transparent: true,
        opacity: this.data.opacity, blending: THREE.NormalBlending, depthWrite: false}));
    mesh.rotation.x = -Math.PI / 2;
    this.el.setObject3D('mesh', mesh);
  }
});

// Градиентное небо с лёгким свечением у горизонта.
AFRAME.registerComponent('void-sky', {
  init: function () {
    const c = document.createElement('canvas'); c.width = 8; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0.00, '#17181c'); grad.addColorStop(0.45, '#2a2b30');
    grad.addColorStop(0.50, '#4a4c52'); grad.addColorStop(0.56, '#2a2b30'); grad.addColorStop(1.00, '#1c1d22');
    g.fillStyle = grad; g.fillRect(0, 0, 8, 256);
    const skyTex = new THREE.CanvasTexture(c); skyTex.colorSpace = THREE.SRGBColorSpace;
    // Дальний купол (радиус 1500 м) едет за игроком, поэтому всегда выглядит как небо вокруг, а не как шар
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1500, 32, 24),
      new THREE.MeshBasicMaterial({map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false}));
    mesh.renderOrder = -2; // сначала купол, потом звёзды, потом всё остальное
    this.el.setObject3D('mesh', mesh);
    // Звёзды: 1500 точек на сфере чуть ближе купола, разной яркости, с лёгким тёплым и холодным оттенком
    const N = 1500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      pos[i * 3] = 1400 * s * Math.cos(a); pos[i * 3 + 1] = 1400 * u; pos[i * 3 + 2] = 1400 * s * Math.sin(a);
      const v = 0.35 + 0.65 * Math.pow(Math.random(), 2), w = Math.random();
      col[i * 3] = v * (w < 0.3 ? 1.0 : 0.85); col[i * 3 + 1] = v * 0.9; col[i * 3 + 2] = v * (w > 0.7 ? 1.0 : 0.85);
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: 2.5, sizeAttenuation: false, vertexColors: true, fog: false, depthWrite: false }));
    stars.frustumCulled = false; stars.renderOrder = -1;
    this.el.setObject3D('stars', stars);
    this.player = document.querySelector('#player');
  },
  tick: function () {
    if (this.player) this.el.object3D.position.copy(this.player.object3D.position);
  }
});

// Газовый гигант в дымке: виден над дальней частью пустоты, нижняя часть уходит под пол.
AFRAME.registerComponent('gas-planet', {
  schema: { radius: {default: 10} },
  init: function () {
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#7d604c'); grad.addColorStop(0.45, '#63493b');
    grad.addColorStop(0.75, '#4a3c36'); grad.addColorStop(1.00, '#3a3c42');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
    for (let i = 0; i < 14; i++) {
      g.fillStyle = 'rgba(200,160,125,' + (0.04 + (i % 3) * 0.02) + ')';
      g.fillRect(0, (i * 37) % 440, 4, 6 + (i % 4) * 4);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(this.data.radius, 48, 32),
      new THREE.MeshBasicMaterial({map: tex, fog: false}));
    this.el.setObject3D('mesh', mesh);
  }
});

// Сатурн с кольцом: висит высоко над пустотой, нижняя часть плавно уходит в дымку.
AFRAME.registerComponent('saturn', {
  schema: { radius: {default: 4} },
  init: function () {
    const R = this.data.radius;
    const group = new THREE.Group();
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#c2a57e'); grad.addColorStop(0.50, '#a08266');
    grad.addColorStop(0.80, '#6f5e4c'); grad.addColorStop(1.00, '#3a3c42');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
    for (let i = 0; i < 12; i++) {
      g.fillStyle = 'rgba(240,220,180,' + (0.05 + (i % 3) * 0.03) + ')';
      g.fillRect(0, (i * 41) % 440, 4, 5 + (i % 4) * 3);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    group.add(new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32),
      new THREE.MeshBasicMaterial({map: tex, fog: false})));
    const ring = new THREE.Mesh(new THREE.RingGeometry(R * 1.35, R * 2.1, 128, 1),
      new THREE.MeshBasicMaterial({color: '#cdb48f', transparent: true, opacity: 0.38,
        side: THREE.DoubleSide, fog: false, depthWrite: false}));
    ring.rotation.x = -1.05;
    group.add(ring);
    this.el.setObject3D('mesh', group);
  }
});

// Огромный газовый шар над головой: освещается солнцем и отбрасывает тень на пол.
AFRAME.registerComponent('overhead-planet', {
  schema: { radius: {default: 8} },
  init: function () {
    // Матовый однотонный шар, без полос.
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(this.data.radius, 48, 32),
      new THREE.MeshStandardMaterial({color: '#6e5d52', roughness: 1, metalness: 0}));
    mesh.castShadow = true;
    this.el.setObject3D('mesh', mesh);
  }
});

// Редкие светящиеся частицы для ощущения глубины (сейчас не используются).
AFRAME.registerComponent('dust', {
  schema: { count: {default: 220}, radius: {default: 22} },
  init: function () {
    const n = this.data.count, p = new Float32Array(n * 3);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * this.data.radius;
      p[i*3] = Math.cos(a) * r; p[i*3+1] = 0.3 + rnd() * 6; p[i*3+2] = Math.sin(a) * r;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
    this.el.setObject3D('mesh', new THREE.Points(geo,
      new THREE.PointsMaterial({color: '#7fe8ff', size: 0.045, transparent: true, opacity: 0.7, depthWrite: false})));
  }
});

// Не даёт уйти слишком далеко от центра.
AFRAME.registerComponent('limit-radius', {
  schema: { max: {default: 14} },
  tick: function () {
    const p = this.el.object3D.position, d = Math.hypot(p.x, p.z);
    if (d > this.data.max) { p.x *= this.data.max / d; p.z *= this.data.max / d; }
  }
});
</script>
</head>
<body>
  <a-scene id="scene" background="color: #1c1d22"
           renderer="antialias: true" webxr="referenceSpaceType: local; optionalFeatures: local-floor">

    <!-- Освещение: холодный общий свет, тёплый над креслом, голубая подсветка сзади -->
    <a-light type="ambient" color="#8fa0c5" intensity="1.0"></a-light>
    <a-light id="sun" type="directional" position="-6 34 -30" color="#fff4e6" intensity="1.2"></a-light>
    <a-light type="point" position="0 3 -1.5" color="#ffb070" intensity="9" distance="9" decay="2"></a-light>
    <a-light type="point" position="0 1.4 -6" color="#d9a77a" intensity="14" distance="14" decay="2"></a-light>

    <a-entity void-sky></a-entity>
    <a-entity grid-floor></a-entity>
    <a-entity pedestal></a-entity>
    <a-entity orbit-body="index: 0"></a-entity>
    <a-entity orbit-body="index: 1"></a-entity>
    <a-entity orbit-body="index: 2"></a-entity>
    <a-entity orbit-body="index: 3"></a-entity>
    <a-entity orbit-body="index: 4"></a-entity>
    <a-entity orbit-body="index: 5"></a-entity>
    <a-entity orbit-body="index: 6"></a-entity>
    <a-entity orbit-body="index: 7"></a-entity>
    <a-entity orbit-body="index: 8"></a-entity>
    <a-entity orbit-body="index: 9"></a-entity>

    <!-- Предметы галереи создаются из списка GALLERY выше -->
    <a-entity id="gallery"></a-entity>
    <a-entity id="ship" ship></a-entity>
    <a-entity id="gunnery" gunnery></a-entity>

    <!-- Игрок и VR-камера -->
    <a-entity id="player" position="0 0.9 3.2">
      <a-entity id="seat" position="0 0.7 0">
        <a-camera look-controls hud position="0 0 0" fov="70" near="0.1" far="3000">
          <a-plane id="crash-plane" position="0 0 -0.3" width="4" height="3" material="color: #000; opacity: 0; transparent: true; depthTest: false"></a-plane>
        </a-camera>
      </a-entity>
      <a-entity laser-controls="hand: left" id="left-hand"></a-entity>
      <a-entity laser-controls="hand: right" id="right-hand"></a-entity>
    </a-entity>
  </a-scene>

<script>
// Строим сцену из списка GALLERY.
(function () {
  const root = document.querySelector('#gallery');
  for (const it of GALLERY) {
    const holder = document.createElement('a-entity');
    holder.setAttribute('id', it.id + '-holder');
    holder.setAttribute('position', it.pos.join(' '));
    holder.setAttribute('rotation', '0 ' + (it.rot || 0) + ' 0');
    if (it.scale) holder.setAttribute('scale', it.scale.join(' '));
    const model = document.createElement(it.inst ? 'a-entity' : 'a-gltf-model');
    model.setAttribute('id', it.id);
    if (it.inst) model.setAttribute('instance-glb', 'src: ./' + it.src);
    else model.setAttribute('src', './' + it.src);
    if (it.fit) model.setAttribute('fit-furniture', `axis: ${it.fit[0]}; size: ${it.fit[1]}`);
    holder.appendChild(model);
    root.appendChild(holder);
    if (it.pool) {
      const pool = document.createElement('a-entity');
      pool.setAttribute('position', `${it.pos[0]} 0.01 ${it.pos[2]}`);
      pool.setAttribute('glow-pool', `color: ${it.pool[0]}; radius: ${it.pool[1]*0.8}; opacity: 0.6`);
      root.appendChild(pool);
    }
  }
})();

// Управление Quest: левый стик – движение, правый – поворот на 30°.
AFRAME.registerComponent('thumbstick-movement', {
  init: function () {
    this.axisX = 0;
    this.axisY = 0;
    const leftHand = document.querySelector('#left-hand');
    leftHand.addEventListener('thumbstickmoved', (event) => {
      this.axisX = event.detail.x;
      this.axisY = event.detail.y;
    });
  },
  tick: function (time, delta) {
    if (!this.el.sceneEl.is('vr-mode')) return;
    const deadzone = 0.15;
    const x = Math.abs(this.axisX) > deadzone ? this.axisX : 0;
    const y = Math.abs(this.axisY) > deadzone ? this.axisY : 0;
    if (x === 0 && y === 0) return;
    // В полёте ходьба отключена: управляет только ранец.
    const jet = document.querySelector('#player').components['jetpack-flight'];
    if (jet && (jet.piloting || !jet.grounded || jet.nearPlanet)) return;
    const player = document.querySelector('#player');
    const camera = player.querySelector('[camera]');
    const direction = new THREE.Vector3(x, 0, y);
    const rotation = new THREE.Quaternion();
    camera.object3D.getWorldQuaternion(rotation);
    direction.applyQuaternion(rotation);
    // Ходьба по касательной к поверхности, на которой стоишь (пол, планета или многогранник)
    const nUp = jet && jet.grounded ? jet.surfN : new THREE.Vector3(0, 1, 0);
    direction.addScaledVector(nUp, -direction.dot(nUp));
    direction.normalize();
    const speed = 1.5;
    const seconds = Math.min(delta / 1000, 0.05);
    player.object3D.position.addScaledVector(direction, speed * seconds);
  }
});
document.querySelector('#player').setAttribute('thumbstick-movement', '');

AFRAME.registerComponent('snap-turn', {
  init: function () {
    this.ready = true;
    const rightHand = document.querySelector('#right-hand');
    rightHand.addEventListener('thumbstickmoved', (event) => {
      const x = event.detail.x;
      if (Math.abs(x) < 0.3) { this.ready = true; return; }
      if (!this.ready || Math.abs(x) < 0.75) return;
      this.ready = false;
      const angle = x > 0 ? -Math.PI / 6 : Math.PI / 6;
      const jet = this.el.components['jetpack-flight']; if (jet) jet.yaw += angle;
    });
  }
});

// Ранец: гравитация, инерция, тяга по взгляду (как посадочный модуль).
// Тяга: триггер правой руки (на ПК – пробел). Посадка мягкая до 6 м/с, быстрее – разбивается и возвращает на старт.
// Касание: до STICK_SPEED – мягкая посадка (прилипаешь), от STICK_SPEED до CRASH_SPEED – отскок, выше – авария.
// Тяга: основные сопла (вверх и вперёд) сильнее, боковые/задние/нижние слабее.
const THRUST_MAIN = 11, THRUST_SIDE = 6, CRASH_SPEED = 12, STICK_SPEED = 3, RESTITUTION = 0.4, RETURN_HOLD = 2;
const START = { x: 0, y: 0.9, z: 3.2 };
// Ранец героя слабее корабля: вверх 8 (чтобы можно было прыгать при гравитации 6.5), вперёд 5.5, остальные 3
const HERO_UP = 8, HERO_MAIN = 5.5, HERO_SIDE = 3;
// Половины размеров тела: квадрат 0.5 × 0.5 м в основании и 1.8 м в высоту
const BOX = { x: 0.25, y: 0.9, z: 0.25 };
// Большая планета: целый шар радиусом 120 м. Верх шара на PED метров ниже пола комнаты, а пол – диск радиусом 40 м
// на цилиндрическом пьедестале, который уходит в планету. Поверхности не совпадают, поэтому мерцания нет.
// Три спутника вращаются вокруг её центра по наклонным орбитам и проходят над комнатой.
const CAP_A = 40, BIG_R = 120, PED = 3;
const BIG_C = new THREE.Vector3(0, -(BIG_R + PED), 0);
const BODIES = [
  // Юпитер (большая планета), Сатурн, Нептун и Уран: полосы по широте, как у настоящих
  { big: true, r: BIG_R, bands: ['#c8a27a', '#e8d3b0', '#a8724a', '#d9b48a', '#8c5a3a', '#e2c49a'], spin: 0.04, g: 6.5, name: 'Юпитер' },
  { moon: true, r: 45, bands: ['#e3cf9c', '#f0e2bc', '#d8c08a'], orbit: 200, phase: 2.2, period: 150, spin: 0.25, g: 3.0, name: 'Сатурн' },
  { moon: true, r: 22, bands: ['#3f6fb0', '#5a8ad0', '#2d55a0'], orbit: 250, phase: 0.6, period: 220, spin: 0.5, g: 1.6, name: 'Нептун' },
  { moon: true, r: 32, bands: ['#9ad6dc', '#b4e3e6', '#86c5cc'], orbit: 300, phase: 4.0, period: 320, spin: -0.35, g: 2.2, name: 'Уран' },

      if (m) { m.material.opacity = Math.pow(this.retHold / RETURN_HOLD, 2) * 0.95; this.fadeOn = this.retHold > 0; }
    }

    // 3. Гравитация: сумма притяжений всех планет по закону обратных квадратов, плавно гаснущих к 60 м;
    //    общая гравитация комнаты тоже плавно гаснет к 25 м над полом
    const acc = new THREE.Vector3();
    this.nearPlanet = false;
    for (let i = 0; i < BODIES.length; i++) {
      const dir = bodyPos(i, t).sub(p);
      const dd = dir.length();
      const h = Math.max(dd - BODIES[i].r, 0.01);
      const fall = Math.pow(BODIES[i].r / (BODIES[i].r + h), 2);
      const fade = BODIES[i].big ? 1 : Math.pow(Math.max(0, 1 - h / 60), 2);
      acc.addScaledVector(dir, BODIES[i].g * fall * fade / dd);
      if (h < 30 && BODIES[i].moon) this.nearPlanet = true; // у спутника ходить нельзя (планеты и обелиски – можно)
    }
    this.vel.addScaledVector(acc, dt);
    p.addScaledVector(this.vel, dt);

    // 4. Касание: тело – квадратная коробка. Расстояние до поверхности – половина её размера вдоль нормали
    //    (с учётом ориентации корабля), поэтому коробка садится на грань, а не на точку.
    const invNose = this.nose.clone().invert();
    const support = nw => { const nl = nw.clone().applyQuaternion(invNose); return BOX.x * Math.abs(nl.x) + BOX.y * Math.abs(nl.y) + BOX.z * Math.abs(nl.z); };
    let n = null, touched = false;
    this.carrier = -1;
    const sFloor = support(WORLD_UP);
    let rH = Math.hypot(p.x, p.z);
    // Стенка пьедестала: снаружи ниже уровня пола не пускает внутрь; удар сильнее порога – авария
    const rH0 = Math.hypot(p.x - this.vel.x * dt, p.z - this.vel.z * dt);
    const WR = 0.35;
    if (rH0 > CAP_A && rH < CAP_A + WR && p.y < sFloor - 0.05 && p.y > -30) {
      const vr = (this.vel.x * p.x + this.vel.z * p.z) / Math.max(rH, 1e-6);
      const k = (CAP_A + WR) / Math.max(rH, 1e-6);
      p.x *= k; p.z *= k; rH = CAP_A + WR;
      if (vr < 0) {
        if (-vr > CRASH_SPEED) { this.crash(); return; }
        this.vel.x -= vr * p.x / rH; this.vel.z -= vr * p.z / rH;
      }
    }
    if (rH <= CAP_A && p.y <= sFloor) {
      // Пол комнаты – диск на пьедестале
      n = WORLD_UP.clone();
      p.y = sFloor;
      touched = true;
    } else {
      for (let i = 0; i < BODIES.length; i++) {
        if (BODIES[i].planes) {
          const hit = polyContact(i, p, t, support);
          if (hit) { n = hit.n; p.add(hit.push); touched = true; this.carrier = i; break; }
          continue;
        }
        const c = bodyPos(i, t);
        const dd = p.distanceTo(c);
        if (dd < 1e-6) continue;
        const nn = p.clone().sub(c).multiplyScalar(1 / dd);
        const s = support(nn);
        if (dd <= BODIES[i].r + s) {
          n = nn;
          p.copy(c).addScaledVector(n, BODIES[i].r + s);
          touched = true; this.carrier = i;
          break;
        }
      }
    }
    this.grounded = touched;
    if (touched) {
      this.surfN.copy(n);
      // Скорость относительно поверхности: планета движется по орбите, поэтому сравниваем с её скоростью
      // Скорость точки поверхности = орбитальная скорость + вращение вокруг своей оси
      let vB = new THREE.Vector3();
      if (this.carrier >= 0) {
        vB = bodyPos(this.carrier, t).sub(bodyPos(this.carrier, t - dt)).multiplyScalar(1 / dt);
        const rr = p.clone().sub(bodyPos(this.carrier, t));
        vB.add(new THREE.Vector3(0, BODIES[this.carrier].spin, 0).cross(rr));
      }
      const rel = this.vel.clone().sub(vB);
      const rn = rel.dot(n);
      const impact = Math.max(-rn, 0);
      if (impact > CRASH_SPEED) { this.crash(); return; }
      const relT = rel.clone().addScaledVector(n, -rn); // касательная составляющая
      if (impact > STICK_SPEED) {
        // Отскок: нормальная скорость меняет знак с потерями, касательная частично гасится трением
        relT.multiplyScalar(0.85);
        rel.copy(relT).addScaledVector(n, impact * RESTITUTION);
        this.grounded = false;
        this.lastBounce = t;
      } else {
        // Мягкая посадка: прилипаешь, скольжение быстро гасится трением
        const k = relT.length() < 1 ? 0 : Math.max(0, 1 - 6 * dt);
        rel.copy(relT).multiplyScalar(k).addScaledVector(n, Math.max(rn, 0));
      }
      this.vel.copy(vB).add(rel);
    }

    // 5. Корпус = нос. На поверхности «магнитные ботинки»: верх корабля совмещается с нормалью под ногами
    if (touched) this.nose.premultiply(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0).applyQuaternion(this.nose), n));
    rig.quaternion.copy(this.nose);

    // 6. Ускорение для прибора: изменение скорости за кадр без учёта ударов о поверхность, сглаженное
    if (!this.prevVel) this.prevVel = this.vel.clone();
    const aNow = touched ? 0 : this.vel.distanceTo(this.prevVel) / Math.max(dt, 1e-4);
    this.accelMag = (this.accelMag || 0) + (aNow - (this.accelMag || 0)) * Math.min(1, dt * 6);
    this.prevVel.copy(this.vel);
  },
  crash: function () {
    this.crashing = true;
    this.thrusting = false;
    this.vel.set(0, 0, 0);
    this.setFade(1);
    setTimeout(() => { this.resetToStart(); this.setFade(0); this.crashing = false; }, 700);
  },
  setFade: function (v) {
    const m = this.plane.getObject3D('mesh');
    if (m) m.material.opacity = v;
  },
  resetToStart: function () {
    this.el.object3D.position.set(START.x, START.y, START.z);
    this.vel.set(0, 0, 0);
    this.nose.identity();
    this.angVel.set(0, 0, 0);
    this.grounded = true;
    this.carrier = -1;
    this.surfN.set(0, 1, 0);
    this.retHold = 0;
    this.fadeOn = false;
  },
  returnHome: function () {
    this.resetToStart();
    this.setFade(0);
  }
});
// Приборная панель: скорость и ускорение, схемы сопел, полоса возврата. Рисуется на холсте ~10 раз в секунду.
AFRAME.registerComponent('hud', {
  init: function () {
    this.cv = document.createElement('canvas');
    this.cv.width = 512; this.cv.height = 210;

    const ring = new THREE.Mesh(new THREE.RingGeometry(0.0035, 0.0055, 28), cm); ring.position.set(0, 0, -1); ring.renderOrder = 1000;
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.0009, 8), cm); dot.position.set(0, 0, -1); dot.renderOrder = 1000;
    this.el.object3D.add(ring); this.el.object3D.add(dot);
    this.acc = 0;
  },
  nearest: function (jf, t) {
    const p = jf.el.object3D.position;
    let best = { name: 'Комната', h: Infinity, vB: new THREE.Vector3() };
    if (Math.hypot(p.x, p.z) <= CAP_A + 3) best.h = Math.max(p.y, 0);
    for (let i = 0; i < BODIES.length; i++) {
      const c = bodyPos(i, t);
      const h = p.distanceTo(c) - BODIES[i].r;
      if (h < best.h) {
        const vB = c.clone().sub(bodyPos(i, t - 0.05)).multiplyScalar(20);
        vB.add(new THREE.Vector3(0, BODIES[i].spin, 0).cross(p.clone().sub(c)));
        best = { name: BODIES[i].name || '', h, vB };
      }
    }
    return best;
  },
  flame: function (c, x, y, dx, dy, f) {
    // Сопло-заглушка и пламя длиной по доле тяги
    c.fillStyle = '#6b7385';
    c.fillRect(x - 4 - Math.abs(dy) * 4, y - 4 - Math.abs(dx) * 4, 8 + Math.abs(dy) * 8, 8 + Math.abs(dx) * 8);
    if (f < 0.03) return;
    const L = 6 + 26 * f;
    c.fillStyle = f > 0.7 ? '#ffd24a' : '#ff8a1e';
    c.beginPath();
    c.moveTo(x + dy * -5, y + dx * 5);
    c.lineTo(x + dy * 5, y + dx * -5);
    c.lineTo(x + dx * (4 + L), y + dy * (4 + L));
    c.closePath(); c.fill();
  },
  tick: function (time) {
    if (time - this.acc < 100) return;
    this.acc = time;
    const jf = document.querySelector('#player').components['jetpack-flight'];
    if (!jf || !jf.vel) return;
    const t = time / 1000;
    const nb = this.nearest(jf, t);
    const speed = jf.vel.distanceTo(nb.vB);
    const room = jf.vel.length();
    const c = this.ctx;
    c.clearRect(0, 0, 512, 210);
    c.fillStyle = 'rgba(4,10,20,0.32)';
    c.fillRect(0, 0, 512, 210);
    c.strokeStyle = '#5fb4c8'; c.lineWidth = 1.5; c.strokeRect(1, 1, 510, 208);
    c.fillStyle = '#5fb4c8'; c.font = 'bold 15px sans-serif';
    c.fillText('СКОРОСТЬ', 16, 34);
    c.fillStyle = '#e8f0f6'; c.font = 'bold 30px sans-serif';
    c.fillText(speed.toFixed(1), 16, 92);
    c.font = '15px sans-serif'; c.fillStyle = '#9fb4c8';
    c.fillText('м/с отн. ' + nb.name, 16, 118);
    c.fillStyle = '#5fb4c8'; c.font = 'bold 15px sans-serif';
    c.fillText('УСКОРЕНИЕ', 16, 156);
    c.fillStyle = '#e8f0f6'; c.font = 'bold 30px sans-serif';
    c.fillText((jf.accelMag || 0).toFixed(1), 16, 198);
    c.font = '15px sans-serif'; c.fillStyle = '#9fb4c8';
    c.fillText('м/с²', 110, 198);
    // Схемы сопел: вид сзади (вверх, вниз, вправо, влево) и вид сбоку (вперёд, назад).
    // Пламя вылетает в сторону, противоположную тяге.
    const th = jf.thr || [0, 0, 0, 0, 0, 0];
    const fx = 330, fy = 95, sx = 440, sy = 95;
    c.fillStyle = '#1b2433'; c.strokeStyle = '#5fb4c8'; c.lineWidth = 1;
    c.fillRect(fx - 22, fy - 22, 44, 44); c.strokeRect(fx - 22, fy - 22, 44, 44);
    c.fillRect(sx - 28, sy - 16, 56, 32); c.strokeRect(sx - 28, sy - 16, 56, 32);
    c.fillStyle = '#5fb4c8'; c.fillRect(sx + 28, sy - 6, 8, 12); // нос
    this.flame(c, fx, fy + 22, 0, 1, th[0]);   // тяга вверх – пламя снизу
    this.flame(c, fx, fy - 22, 0, -1, th[1]);  // тяга вниз – пламя сверху
    this.flame(c, fx - 22, fy, -1, 0, th[2]);  // тяга вправо – пламя слева
    this.flame(c, fx + 22, fy, 1, 0, th[3]);   // тяга влево – пламя справа
    this.flame(c, sx - 28, sy, -1, 0, th[4]);  // тяга вперёд – пламя сзади
    this.flame(c, sx + 28, sy, 1, 0, th[5]);   // тяга назад – пламя спереди (у носа)
    // Возврат: короткая подпись и состояние кнопок для проверки (A – сесть, Y – возврат), светятся только нажатые
    const hold = jf.retHold || 0;
    c.fillStyle = hold > 0 ? '#ff8a1e' : '#6f8296'; c.font = '13px sans-serif';
    c.fillText(hold > 0 ? 'ВОЗВРАТ ' + (RETURN_HOLD - hold).toFixed(1) + ' с' : 'Возврат: держать 2 с (Y / R)', 250, 190);
    const ps = jf.padShown || {};
    c.font = 'bold 13px sans-serif';
    c.fillStyle = (ps.A || ps.X) ? '#5fb4c8' : '#2a3544'; c.fillText('A/X', 420, 30);
    c.fillStyle = ps.B ? '#5fb4c8' : '#2a3544'; c.fillText('B', 478, 30);
    c.fillStyle = ps.Y ? '#5fb4c8' : '#2a3544'; c.fillText('Y', 500, 30);
    this.tex.needsUpdate = true;
  }
});
document.querySelector('#player').setAttribute('jetpack-flight', '');

<script>
// ===== Корабль: жёсткое тело на четырёх ножках с боковыми двигателями =====
// Модель строится в координатах корпуса (начало – центр корпуса, нос – в сторону -Z, верх – +Y).
// Центр масс смещён вниз, поэтому корабль садится устойчиво, но при боковом сносе может завалиться.
const SHIP_COM = new THREE.Vector3(0, -0.3, 0);
const SHIP_INERTIA = [1.6, 2.1, 1.7];                 // момент инерции по осям корпуса (масса = 1)
const SHIP_START = new THREE.Vector3(12, 1.4, 6);      // центр масс на старте (на полу комнаты)
const SHIP_EYE = new THREE.Vector3(0, 0.35, -0.3);     // глаза пилота в координатах корпуса (сидит выше, чем ходит)
const SHIP_EXIT = new THREE.Vector3(2.6, -0.65, 0.2);  // куда встаёт герой при выходе (справа от корабля)
const SHIP_PTS = (() => {
  const a = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) a.push([sx * 1.25, -1.3, sz * 1.15, 0.3, 0]);        // опоры (тип 0)
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) a.push([sx * 1.1, sy * 0.8, sz * 1.3, 0.08, 1]); // углы корпуса
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) a.push([sx * 1.45, -0.1, sz * 0.5, 0.4, 1]);          // двигатели
  a.push([0, 0.8, 0, 0.08, 1], [1.1, 0, 0, 0.08, 1], [-1.1, 0, 0, 0.08, 1]);
  return a;
})();
const SHIP_PAD_CRASH = 12, SHIP_HULL_CRASH = 7, SHIP_MU = 1.0;

function buildShipModel() {
  const g = new THREE.Group();
  const M = (c, m, r, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: m, roughness: r }, o || {}));
  const hullM = M('#b4bcc9', 0.1, 0.55), darkM = M('#3a3f4a', 0.1, 0.6), accM = M('#ff7a1a', 0.1, 0.5), inM = M('#4a4f5c', 0.1, 0.7);
  const glowM = new THREE.MeshBasicMaterial({ color: '#18e0ff' });
  const box = (w, h, d, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const rod = (ax, ay, az, bx, by, bz, r, mat) => {
    const A = new THREE.Vector3(ax, ay, az), B = new THREE.Vector3(bx, by, bz);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 10), mat);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(AXIS_Y, B.clone().sub(A).normalize());
    m.castShadow = true; g.add(m); return m;
  };
  const T = 0.08;
  // Корпус-кабина: панели с оконным проёмом спереди
  box(2.2, T, 2.6, 0, -0.8, 0, inM);
  box(2.2, T, 2.6, 0, 0.8, 0, hullM);
  box(2.2, 1.6, T, 0, 0, 1.3, hullM);
  box(T, 1.6, 2.6, -1.1, 0, 0, hullM);
  box(T, 1.6, 2.6, 1.1, 0, 0, hullM);
  box(0.02, 0.14, 2.64, -1.12, 0, 0, accM); box(0.02, 0.14, 2.64, 1.12, 0, 0, accM); box(2.24, 0.14, 0.02, 0, 0, 1.32, accM); // оранжевый пояс снаружи
  // Лобовое стекло и стойки
  // Передняя часть – целиком стекло, без стоек: как в кабине Ми-8 и батискафе
  const glassM = new THREE.MeshStandardMaterial({ color: '#9fe8ff', metalness: 0, roughness: 0.05, transparent: true, opacity: 0.13, depthWrite: false, side: THREE.DoubleSide });
  box(2.2, 1.6, 0.02, 0, 0, -1.3, glassM).castShadow = false;
  // Кабина изнутри: кресло, приборная панель
  box(0.7, 0.12, 0.7, 0, -0.35, 0.15, darkM);        // сиденье
  box(0.7, 0.8, 0.12, 0, 0.0, 0.5, darkM);           // спинка
  box(1.8, 0.35, 0.5, 0, -0.45, -1.0, darkM);        // панель
  box(1.4, 0.04, 0.3, 0, -0.26, -1.02, glowM);       // светящийся экран
  // Ножки и опоры
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    rod(sx * 0.9, -0.8, sz * 1.0, sx * 1.25, -1.55, sz * 1.15, 0.07, darkM);
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.08, 20), hullM);
    pad.position.set(sx * 1.25, -1.57, sz * 1.15); pad.castShadow = true; g.add(pad);
  }
  // Боковые двигатели: корпус, сопло сзади, оранжевая полоса, крепление к кабине
  for (const sx of [-1, 1]) {
    const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 20), hullM);
    pod.rotation.x = Math.PI / 2; pod.position.set(sx * 1.45, -0.1, 0); pod.castShadow = true; g.add(pod);
    const nz = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 0.25, 20), darkM);
    nz.rotation.x = Math.PI / 2; nz.position.set(sx * 1.45, -0.1, 0.85); g.add(nz);

    cap.rotation.x = -Math.PI / 2; cap.position.set(sx * 1.45, -0.1, -0.75); g.add(cap);

  }
  return g;
}

AFRAME.registerComponent('ship', {
  init: function () {
    this.pos = SHIP_START.clone();
    this.q = new THREE.Quaternion().setFromAxisAngle(AXIS_Y, 0.6);
    this.vel = new THREE.Vector3(); this.w = new THREE.Vector3();

    this.cache = [];
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
    const cx = cv.getContext('2d'); cx.fillStyle = 'rgba(4,10,20,0.6)'; cx.fillRect(0, 0, 256, 64);
    cx.strokeStyle = '#18e0ff'; cx.lineWidth = 2; cx.strokeRect(1, 1, 254, 62);
    cx.fillStyle = '#fff'; cx.font = 'bold 28px sans-serif'; cx.textAlign = 'center'; cx.fillText('B / E – сесть', 128, 42);
    this.hint = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
    this.hint.scale.set(1.6, 0.4, 1); this.hint.renderOrder = 998; this.hint.visible = false;
    this.el.sceneEl.object3D.add(this.hint);
  },
  // Кэш положений и скоростей тел на этот кадр
  prepare: function (t) {
    for (let i = 0; i < BODIES.length; i++) {
      const c = bodyPos(i, t), c0 = bodyPos(i, t - 0.02);
      const q = new THREE.Quaternion().setFromAxisAngle(AXIS_Y, t * BODIES[i].spin);
      this.cache[i] = { c, v: c.clone().sub(c0).multiplyScalar(50), q, qi: q.clone().invert() };
    }
  },
  gravity: function (p, out) {
    out.set(0, 0, 0);
    for (let i = 0; i < BODIES.length; i++) {
      const B = BODIES[i], dir = this.cache[i].c.clone().sub(p), dd = dir.length();
      const h = Math.max(dd - B.r, 0.01);
      const fall = Math.pow(B.r / (B.r + h), 2);
      const fade = B.big ? 1 : Math.pow(Math.max(0, 1 - h / 60), 2);
      out.addScaledVector(dir, B.g * fall * fade / dd);
    }
    return out;
  },
  // Ближайшая поверхность к шару радиуса rad в точке pw: глубина вдавливания, нормаль, скорость поверхности
  surface: function (pw, rad) {
    let best = null;
    if (Math.hypot(pw.x, pw.z) <= CAP_A && pw.y - rad < 0 && pw.y > -3) best = { d: rad - pw.y, n: WORLD_UP, vB: ZERO_V };
    for (let i = 0; i < BODIES.length; i++) {
      const B = BODIES[i], C = this.cache[i];
      const dd = pw.distanceTo(C.c);
      let d, n;
      if (B.planes) {
        if (dd > B.size * 1.6 + rad) continue;
        const L = pw.clone().sub(C.c).applyQuaternion(C.qi);
        let bs = -Infinity, bk = -1;
        for (let k = 0; k < B.planes.length; k++) { const s = B.planes[k].n.dot(L) - B.planes[k].d; if (s > bs) { bs = s; bk = k; } }
        if (bs >= rad) continue;
        d = rad - bs; n = B.planes[bk].n.clone().applyQuaternion(C.q);
      } else {
        if (dd > B.r + rad) continue;
        d = B.r + rad - dd; n = pw.clone().sub(C.c).multiplyScalar(1 / Math.max(dd, 1e-6));
      }
      if (!best || d > best.d) {
        const vB = C.v.clone().add(new THREE.Vector3(0, B.spin, 0).cross(pw.clone().sub(C.c)));
        best = { d, n, vB };
      }
    }
    return best;
  },
  iw: function (v, out) {
    out.copy(v).applyQuaternion(this.qi);
    out.x /= SHIP_INERTIA[0]; out.y /= SHIP_INERTIA[1]; out.z /= SHIP_INERTIA[2];
    return out.applyQuaternion(this.q);
  },
  substep: function (h, thrustW, jf) {
    const g = this.gravity(this.pos, new THREE.Vector3());
    this.vel.addScaledVector(g, h).addScaledVector(thrustW, h);
    this.pos.addScaledVector(this.vel, h);
    const wl = this.w.length();
    if (wl > 1e-6) this.q.premultiply(new THREE.Quaternion().setFromAxisAngle(this.w.clone().multiplyScalar(1 / wl), wl * h)).normalize();
    this.qi = this.q.clone().invert();
    // Контакты
    const cons = [];
    const R = new THREE.Vector3();
    for (const P of SHIP_PTS) {
      const r = new THREE.Vector3(P[0], P[1], P[2]).sub(SHIP_COM).applyQuaternion(this.q);
      const pw = this.pos.clone().add(r);
      const S = this.surface(pw, P[3]);
      if (S && S.d > 0) cons.push({ r, n: S.n, d: S.d, vB: S.vB, kind: P[4] });
    }
    this.nContacts = cons.length;
    const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
    // Подготовка: скорости удара до любых импульсов (иначе первая опора получает весь отскок и корабль кувыркается)
    for (const c of cons) {
      const v0 = this.vel.clone().add(tmp.copy(this.w).cross(c.r)).sub(c.vB);
      const vn0 = v0.dot(c.n);
      c.acc = 0;
      c.bias = vn0 < -STICK_SPEED ? -RESTITUTION * vn0 : 0;
      if (-vn0 > (c.kind === 0 ? SHIP_PAD_CRASH : SHIP_HULL_CRASH)) this.crashFlag = true;
      c.rn = new THREE.Vector3().crossVectors(c.r, c.n);
      c.kn = 1 + tmp2.crossVectors(this.iw(c.rn, tmp), c.r).dot(c.n);
    }
    for (let it = 0; it < 8; it++) {
      for (const c of cons) {
        const v = this.vel.clone().add(tmp.copy(this.w).cross(c.r)).sub(c.vB);
        const vn = v.dot(c.n);
        let dj = (c.bias - vn) / c.kn;
        const nacc = Math.max(0, c.acc + dj);
        dj = nacc - c.acc; c.acc = nacc;
        if (dj !== 0) { this.vel.addScaledVector(c.n, dj); this.w.addScaledVector(this.iw(c.rn, tmp), dj); }
        // Трение Кулона: предел – мю на накопленную нормальную силу
        const v2 = this.vel.clone().add(tmp.copy(this.w).cross(c.r)).sub(c.vB);
        const vt = v2.addScaledVector(c.n, -v2.dot(c.n));
        const vtl = vt.length();
        if (vtl > 1e-5) {
          const tdir = vt.multiplyScalar(1 / vtl);
          const rt = new THREE.Vector3().crossVectors(c.r, tdir);
          const kt = 1 + tmp2.crossVectors(this.iw(rt, tmp), c.r).dot(tdir);
          const room = Math.max(0, SHIP_MU * c.acc - (c.fric || 0));
          const jt = Math.min(vtl / kt, room);
          c.fric = (c.fric || 0) + jt;
          this.vel.addScaledVector(tdir, -jt);
          this.w.addScaledVector(this.iw(rt, tmp), -jt);
        }
      }
    }
    // Выталкивание из поверхности
    for (const c of cons) {
      const push = Math.max(c.d - 0.003, 0) * 0.7;
      if (push > 0) { this.pos.addScaledVector(c.n, push); for (const c2 of cons) c2.d -= push * c.n.dot(c2.n); }
    }
    if (cons.length) this.w.multiplyScalar(Math.max(0, 1 - 1.2 * h));
  },
  reset: function () {
    this.pos.copy(SHIP_START); this.q.setFromAxisAngle(AXIS_Y, 0.6);
    this.vel.set(0, 0, 0); this.w.set(0, 0, 0); this.crashFlag = false; this.retHold = 0;
  },
  enter: function (jf) {
    this.piloting = true; jf.piloting = true;
    document.querySelector('#seat').object3D.position.copy(SHIP_EYE).sub(SHIP_COM);
    jf.vel.copy(this.vel);
  },
  exit: function (jf) {
    this.piloting = false; jf.piloting = false;
    document.querySelector('#seat').object3D.position.set(0, 0.7, 0);
    const p = jf.el.object3D.position;
    p.copy(this.pos).add(SHIP_EXIT.clone().sub(SHIP_COM).applyQuaternion(this.q));
    jf.vel.copy(this.vel); jf.nose.copy(this.q); jf.angVel.set(0, 0, 0); jf.grounded = false;
    jf.thr.fill(0);
  },
  tick: function (time, delta) {
    const jf = document.querySelector('#player').components['jetpack-flight'];
    if (!jf || !jf.nose) return;
    if (jf.crashing && this.piloting) return;
    const dt = Math.min(delta / 1000, 0.05), t = time / 1000;
    this.prepare(t);
    const vr = this.el.sceneEl.is('vr-mode'), K = jf.keys || {};
    // Вход и выход: ПК – E, VR – правая кнопка A
    let eBtn = !!K.KeyE;
    const pads = readPads(jf);
    if (pads.B) eBtn = true;
    if (eBtn && !this.prevE) {
      if (this.piloting) this.exit(jf);
      else if (jf.el.object3D.position.distanceTo(this.pos) < 3.6) this.enter(jf);
    }
    this.prevE = eBtn;

    // Управление кораблём
    const thr = jf.thr || (jf.thr = [0, 0, 0, 0, 0, 0]);
    const thrustW = new THREE.Vector3();
    if (this.piloting) {
      thr.fill(0);
      const dz = v => (Math.abs(v) > 0.15 ? v : 0);
      const THM = THRUST_MAIN, THS = THRUST_SIDE;
      let tr = jf.thrusting ? 1 : 0, tl = jf.lift ? 1 : 0, roll = false;
      let lx = jf.lx, ly = jf.ly, rx = jf.rx, ry = jf.ry, retBtn = !!K.KeyR;
      if (vr) {
        if (pads.tr !== null) tr = Math.max(tr, pads.tr);
        if (pads.tl !== null) tl = Math.max(tl, pads.tl);
        roll = pads.roll; if (pads.Y) retBtn = true;
      }
      const loc = new THREE.Vector3();   // тяга в осях корпуса
      if (!vr) {
        tr = K.Space ? 1 : 0; tl = (K.ShiftLeft || K.ShiftRight) ? 1 : 0;
        lx = (K.KeyD ? 1 : 0) - (K.KeyA ? 1 : 0); ly = (K.KeyS ? 1 : 0) - (K.KeyW ? 1 : 0);
        rx = (K.ArrowRight ? 1 : 0) - (K.ArrowLeft ? 1 : 0); ry = (K.ArrowDown ? 1 : 0) - (K.ArrowUp ? 1 : 0);
        roll = false;
      }
      if (tr > 0.05) { loc.y += tr * THM; thr[0] = tr; }
      if (tl > 0.05) { loc.y -= tl * THS; thr[1] = tl; }
      const sx = dz(lx), sy = -dz(ly);
      loc.x += sx * THS; loc.z -= sy * (sy > 0 ? THM : THS);
      if (sx > 0) thr[2] = sx; else thr[3] = -sx;
      if (sy > 0) thr[4] = sy; else thr[5] = -sy;
      thrustW.copy(loc).applyQuaternion(this.q);
      // Вращение: ускорение по осям корпуса, предел скорости 1.5 рад/с
      const maxRate = 1.5, acc = 2.5 * dt;
      const wl = this.w.clone().applyQuaternion(this.q.clone().invert());
      wl.multiplyScalar(Math.max(0, 1 - 0.35 * dt));
      const clampA = v => Math.max(-maxRate, Math.min(maxRate, v));
      wl.x = clampA(wl.x - dz(ry) * acc);
      if (!vr) {
        wl.z = clampA(wl.z + ((K.KeyQ ? 1 : 0) - (K.KeyC ? 1 : 0)) * acc);
      } else if (roll) wl.z = clampA(wl.z - dz(rx) * acc);
      if (!(vr && roll)) wl.y = clampA(wl.y - dz(rx) * acc);
      this.w.copy(wl).applyQuaternion(this.q);
      // Возврат корабля на старт: удержание R / левая Y
      this.retHold = retBtn ? Math.min(RETURN_HOLD, this.retHold + dt) : Math.max(0, this.retHold - dt * 2);
      jf.retHold = this.retHold;
      jf.setFade(Math.pow(this.retHold / RETURN_HOLD, 2) * 0.95);
      if (this.retHold >= RETURN_HOLD) { this.reset(); jf.setFade(0); }
    }

    // Физика: несколько подшагов
    const N = Math.max(1, Math.ceil(dt / 0.006));
    this.crashFlag = false;
    for (let s = 0; s < N; s++) this.substep(dt / N, thrustW, jf);
    if (this.crashFlag) {
      this.crashCount = (this.crashCount || 0) + 1;
      if (this.piloting) {
        jf.crashing = true; jf.setFade(1);
        setTimeout(() => { this.reset(); this.exit(jf); jf.resetToStart(); jf.setFade(0); jf.crashing = false; }, 700);
      } else this.reset();
    }

    // Подсказка о посадке: когда герой рядом
    const near = !this.piloting && jf.el.object3D.position.distanceTo(this.pos) < 6;
    this.hint.visible = near;
    if (near) this.hint.position.copy(this.pos).addScaledVector(WORLD_UP, 2.4);
    // Показываем корабль
    this.group.quaternion.copy(this.q);
    this.group.position.copy(this.pos).sub(SHIP_COM.clone().applyQuaternion(this.q));
    if (this.piloting) {
      const rig = jf.el.object3D;
      rig.position.copy(this.pos); rig.quaternion.copy(this.q);
      jf.vel.copy(this.vel); jf.surfN.set(0, 1, 0);
      const aNow = this.nContacts ? 0 : this.vel.distanceTo(this.prevVel) / Math.max(dt, 1e-4);
      this.accelMag += (aNow - this.accelMag) * Math.min(1, dt * 6);
      jf.accelMag = this.accelMag;
    }
    this.prevVel.copy(this.vel);
  }
});
const ZERO_V = new THREE.Vector3();
</script>

<script>
// ===== Стрельба: пули с физикой (их тянет гравитация планет), мишени на кубе, которые разлетаются на обломки =====
const BULLET_SPEED = 150, BULLET_LIFE = 6, FIRE_COOLDOWN = 0.14, RESPAWN_DELAY = 10; // мишень возвращается через 10 с после разрушения
const CUBE_I = BODIES.findIndex(b => b.poly === 'cube');
const TARGET_HS = 2;
const TARGET_LAYOUT = [];
for (const x of [-1, 0, 1]) for (const z of [-1, 0, 1]) TARGET_LAYOUT.push([x * 6, z * 6]);
// Гравитация всех тел в точке p (та же формула, что у корабля и героя)
function gravAt(p, t, out) {
  out.set(0, 0, 0);
  for (let i = 0; i < BODIES.length; i++) {
    const B = BODIES[i], dir = bodyPos(i, t).sub(p), dd = dir.length();
    const h = Math.max(dd - B.r, 0.01);
    const fall = Math.pow(B.r / (B.r + h), 2);
    const fade = B.big ? 1 : Math.pow(Math.max(0, 1 - h / 60), 2);
    out.addScaledVector(dir, B.g * fall * fade / dd);
  }
  return out;
}
// Внутри какого тела точка: индекс тела, -2 – пол комнаты, -1 – снаружи
function insideBody(p, t) {
  if (Math.hypot(p.x, p.z) <= CAP_A && p.y <= 0) return -2;
  for (let i = 0; i < BODIES.length; i++) {
    const B = BODIES[i], c = bodyPos(i, t);
    if (B.planes) {
      const q = new THREE.Quaternion().setFromAxisAngle(AXIS_Y, t * B.spin);
      const L = p.clone().sub(c).applyQuaternion(q.invert());
      let mx = -Infinity;
      for (const pl of B.planes) { const s = pl.n.dot(L) - pl.d; if (s > mx) mx = s; }
      if (mx < 0) return i;
    } else if (p.distanceTo(c) < B.r) return i;
  }
  return -1;
}
AFRAME.registerComponent('gunnery', {
  init: function () {
    this.scene = this.el.sceneEl.object3D;
    this.bullets = []; this.debris = []; this.cd = 0; this.tgt = [];
    const geo = new THREE.BoxGeometry(TARGET_HS * 2, TARGET_HS * 2, TARGET_HS * 2);
    const mat = new THREE.MeshStandardMaterial({ color: '#e0893a', metalness: 0.3, roughness: 0.45, emissive: '#3a1a00', emissiveIntensity: 0.6 });
    for (const L of TARGET_LAYOUT) {
      const local = new THREE.Vector3(L[0], BODIES[CUBE_I].r + TARGET_HS, L[1]);
      const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true; this.scene.add(mesh);
      this.tgt.push({ local, mesh, alive: true, world: new THREE.Vector3() });
    }
    this.bulletGeo = new THREE.SphereGeometry(0.07, 8, 6);
    this.bulletMat = new THREE.MeshBasicMaterial({ color: '#ffb347' });
    this.debrisGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    this.debrisMat = new THREE.MeshStandardMaterial({ color: '#e0893a', emissive: '#3a1a00', emissiveIntensity: 0.5 });
    this.cubeC = new THREE.Vector3(); this.cubeQi = new THREE.Quaternion();
  },
  placeTargets: function (t) {
    const c = bodyPos(CUBE_I, t);
    const q = new THREE.Quaternion().setFromAxisAngle(AXIS_Y, t * BODIES[CUBE_I].spin);
    for (const T of this.tgt) {
      T.world.copy(T.local).applyQuaternion(q).add(c);
      T.mesh.position.copy(T.world); T.mesh.quaternion.copy(q);
    }
    this.cubeC.copy(c); this.cubeQi.copy(q).invert();
  },
  spawn: function (o, d, base) {
    const mesh = new THREE.Mesh(this.bulletGeo, this.bulletMat);
    mesh.position.copy(o); this.scene.add(mesh);
    this.bullets.push({ p: o.clone(), v: d.clone().normalize().multiplyScalar(BULLET_SPEED).add(base), age: 0, mesh });
  },
  burst: function (pos, n, power) {
    for (let k = 0; k < n; k++) {
      const m = new THREE.Mesh(this.debrisGeo, this.debrisMat);
      m.scale.setScalar(0.25 + Math.random() * 0.5);
      m.position.copy(pos); this.scene.add(m);
      const v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8 + 0.2, Math.random() - 0.5).normalize().multiplyScalar((3 + Math.random() * 7) * power);
      this.debris.push({ mesh: m, v, age: 0, w: (Math.random() - 0.5) * 8 });
    }
  },
  destroy: function (T, t) {
    T.alive = false; T.downAt = t; T.mesh.visible = false;
    this.burst(T.world, 14, 1);
  },
  hitTest: function (p, t) {
    const L = p.clone().sub(this.cubeC).applyQuaternion(this.cubeQi);
    for (const T of this.tgt) {
      if (T.alive && Math.abs(L.x - T.local.x) < TARGET_HS && Math.abs(L.y - T.local.y) < TARGET_HS && Math.abs(L.z - T.local.z) < TARGET_HS) {
        this.destroy(T, t); return true;
      }
    }
    return insideBody(p, t) !== -1;
  },
  tick: function (time, delta) {
    const jf = document.querySelector('#player').components['jetpack-flight'];
    if (!jf || !jf.pad) return;
    const dt = Math.min(delta / 1000, 0.05), t = time / 1000;
    this.placeTargets(t);
    // Огонь: правая A, левая X, на ПК – левая кнопка мыши
    const pads = readPads(jf);
    const fire = pads.A || pads.X || !!(jf.keys && jf.keys.Mouse);
    this.cd = Math.max(0, this.cd - dt);
    if (fire && this.cd <= 0) {
      this.cd = FIRE_COOLDOWN;
      const cam = document.querySelector('#player [camera]').object3D;
      const o = new THREE.Vector3(), d = new THREE.Vector3();
      cam.getWorldPosition(o); cam.getWorldDirection(d);
      this.spawn(o.addScaledVector(d, 0.6), d, jf.vel.clone());
    }
    // Пули: несколько подшагов, чтобы не проскочить тонкие мишени
    const SUB = 4, h = dt / SUB, g = new THREE.Vector3();
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i]; let dead = false;
      for (let s = 0; s < SUB && !dead; s++) {
        b.p.addScaledVector(b.v, h);
        gravAt(b.p, t, g); b.v.addScaledVector(g, h);
        if (this.hitTest(b.p, t)) { dead = true; this.burst(b.p, 3, 0.3); }
      }
      b.age += dt;
      if (b.age > BULLET_LIFE || b.p.lengthSq() > 1e8) dead = true;
      b.mesh.position.copy(b.p);
      if (dead) { this.scene.remove(b.mesh); this.bullets.splice(i, 1); }
    }
    // Обломки падают и исчезают через 4 с или при касании тела
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i]; d.age += dt;
      gravAt(d.mesh.position, t, g); d.v.addScaledVector(g, dt);
      d.mesh.position.addScaledVector(d.v, dt);
      d.mesh.rotation.x += d.w * dt; d.mesh.rotation.y += d.w * dt * 0.7;
      if (d.age > 4 || insideBody(d.mesh.position, t) !== -1) { this.scene.remove(d.mesh); this.debris.splice(i, 1); }
    }
    // Каждая мишень возвращается сама через RESPAWN_DELAY секунд после разрушения
    for (const T of this.tgt) if (!T.alive && t - T.downAt > RESPAWN_DELAY) { T.alive = true; T.mesh.visible = true; }
  }
});
</script>

<script>
(function () {
  const scene = document.querySelector('#scene');
  const enable = () => {
    const r = scene.renderer; if (!r) return;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    const sun = document.querySelector('#sun').getObject3D('light');
    if (sun) {
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      const cam = sun.shadow.camera;
      cam.left = -45; cam.right = 45; cam.top = 45; cam.bottom = -45; cam.near = 5; cam.far = 120;
      cam.updateProjectionMatrix();
      sun.shadow.bias = -0.0008;
    }
    // Тень отбрасывают только шар; пол её принимает. Мебель не отбрасывает тени, чтобы не грузить Квест.
  };
  if (scene.hasLoaded) enable(); else scene.addEventListener('loaded', enable);
})();
