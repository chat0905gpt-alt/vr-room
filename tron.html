<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тёмная VR-галерея</title>
<script src="./aframe.min.js"></script>
<script>
// ---------------------------------------------------------------
// Список предметов галереи. Чтобы добавить предмет, добавьте строку.
//   src   – файл GLB рядом с этой страницей
//   pos   – позиция [x, y, z] в метрах (y = 0 это пол)
//   rot   – поворот по вертикали в градусах (0 = лицом к +z, к игроку на старте)
//   fit   – [ось, размер в метрах]: подогнать размер и поставить на пол
//   scale – масштаб по осям [x, y, z] (для шкафа сжимаем глубину)
//   inst  – true: один файл загружается один раз и копируется (экономит память Quest)
//   pool  – световое пятно на полу [цвет, радиус]
// ---------------------------------------------------------------
const WARM = '#ffb070', CYAN = '#d9a77a';
const GALLERY = [
  // Кресло в центре: главный ориентир, к нему лицом стоит игрок.
  {id:'armchair', src:'polyhaven-armchair-01.glb', pos:[0, 0.0004315, -1.5], pool:[WARM, 1.5]},
  {id:'chandelier', src:'polyhaven-lantern-chandelier-01.glb', pos:[0, 3.1, -1.5], scale:[.75,.75,.75]},

  // Глобус справа и телескоп.
  {id:'globe', src:'floor-globe-quest.glb', pos:[3.3, 0, -2.0], pool:[WARM, 1.0]},
  {id:'telescope', src:'brass-telescope.glb', pos:[4.3, 0, 1.3], rot:-60, fit:['y', 1.45], pool:[WARM, 1.0]},

  // Шкаф из 4 видов (Multi-view): стоит ровно, без перекоса, глубина натуральная.
  {id:'cab-mv', src:'victorian-cabinet-mv-quest.glb', pos:[-4.5, 0, -4.0], rot:90, pool:[WARM, 1.6]},

  // Напольные часы (сгенерированы по фото; стекло и циферблат перерисованы, глубина сжата до 0,4 м).
  {id:'clock', src:'grandfather-clock-quest.glb', pos:[2.4, 0, -7.6], rot:0, scale:[1,1,.6], pool:[WARM, 1.2]},

  // Комод из 4 видов (Multi-view), оптимизирован до 60 тысяч граней, высота 0,85 м.
  {id:'komod', src:'komod-quest.glb', pos:[5, 0, -3], rot:0, pool:[WARM, 1.0]},
];

AFRAME.registerComponent('fit-furniture', {
  schema: { axis: {default: 'y'}, size: {default: 1} },
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      model.updateMatrixWorld(true);
      let bounds = new THREE.Box3().setFromObject(model);
      const dimensions = new THREE.Vector3(); bounds.getSize(dimensions);
      const dimension = dimensions[this.data.axis];
      if (!dimension || !Number.isFinite(dimension)) return;
      model.scale.multiplyScalar(this.data.size / dimension);
      model.updateMatrixWorld(true); bounds.setFromObject(model);
      const origin = new THREE.Vector3(); this.el.object3D.getWorldPosition(origin);
      const center = new THREE.Vector3(); bounds.getCenter(center);
      const offset = new THREE.Vector3(origin.x-center.x, origin.y-bounds.min.y, origin.z-center.z);
      const inverse = new THREE.Quaternion(); this.el.object3D.getWorldQuaternion(inverse).invert();
      offset.applyQuaternion(inverse); model.position.add(offset);
    }, {once:true});
  }
});

// Один GLB загружается один раз, дальше копии делят геометрию и текстуры.
AFRAME.registerComponent('instance-glb', {
  schema: { src: {type: 'string'} },
  init: function () {
    const cache = (window.__glbCache = window.__glbCache || {});
    const src = this.data.src;
    if (!cache[src]) cache[src] = new Promise((ok, fail) => new THREE.GLTFLoader().load(src, ok, undefined, fail));
    cache[src].then(gltf => {
      this.el.setObject3D('mesh', gltf.scene.clone(true));
      this.el.emit('model-loaded');
    }).catch(e => console.error('instance-glb failed', src, e));
  }
});

// Пол: тёмная сетка, исчезающая в тумане.
AFRAME.registerComponent('grid-floor', {
  schema: { radius: {default: 40}, cell: {default: 5} },
  init: function () {
    const size = 512, cells = 5, c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = '#4a4c52'; g.fillRect(0, 0, size, size);
    const step = size / cells;
    g.strokeStyle = 'rgba(212,160,120,0.45)'; g.lineWidth = 2;
    for (let i = 1; i < cells; i++) {
      g.beginPath(); g.moveTo(i*step, 0); g.lineTo(i*step, size); g.stroke();
      g.beginPath(); g.moveTo(0, i*step); g.lineTo(size, i*step); g.stroke();
    }
    g.strokeStyle = 'rgba(222,168,128,0.7)'; g.lineWidth = 5;
    g.strokeRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(this.data.radius * 2 / this.data.cell, this.data.radius * 2 / this.data.cell);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(this.data.radius, 64),
      new THREE.MeshStandardMaterial({map: tex, roughness: 1, metalness: 0}));
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    mesh.position.y = 0.05; // чуть выше среза планеты, чтобы не мерцало
    this.el.setObject3D('mesh', mesh);
  }
});

// Световое пятно на полу под предметом.
AFRAME.registerComponent('glow-pool', {
  schema: { color: {default: '#d9a77a'}, radius: {default: 1.5}, opacity: {default: 0.5} },
  init: function () {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.45, 'rgba(255,255,255,0.35)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(this.data.radius, 32),
      new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(c), color: '#000000', transparent: true,
        opacity: this.data.opacity, blending: THREE.NormalBlending, depthWrite: false}));
    mesh.rotation.x = -Math.PI / 2;
    this.el.setObject3D('mesh', mesh);
  }
});

// Градиентное небо с лёгким свечением у горизонта.
AFRAME.registerComponent('void-sky', {
  init: function () {
    const c = document.createElement('canvas'); c.width = 8; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0.00, '#17181c'); grad.addColorStop(0.45, '#2a2b30');
    grad.addColorStop(0.50, '#4a4c52'); grad.addColorStop(0.56, '#2a2b30'); grad.addColorStop(1.00, '#1c1d22');
    g.fillStyle = grad; g.fillRect(0, 0, 8, 256);
    const skyTex = new THREE.CanvasTexture(c); skyTex.colorSpace = THREE.SRGBColorSpace;
    // Дальний купол (радиус 1500 м) едет за игроком, поэтому всегда выглядит как небо вокруг, а не как шар
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1500, 32, 24),
      new THREE.MeshBasicMaterial({map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false}));
    mesh.renderOrder = -2; // сначала купол, потом звёзды, потом всё остальное
    this.el.setObject3D('mesh', mesh);
    // Звёзды: 1500 точек на сфере чуть ближе купола, разной яркости, с лёгким тёплым и холодным оттенком
    const N = 1500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      pos[i * 3] = 1400 * s * Math.cos(a); pos[i * 3 + 1] = 1400 * u; pos[i * 3 + 2] = 1400 * s * Math.sin(a);
      const v = 0.35 + 0.65 * Math.pow(Math.random(), 2), w = Math.random();
      col[i * 3] = v * (w < 0.3 ? 1.0 : 0.85); col[i * 3 + 1] = v * 0.9; col[i * 3 + 2] = v * (w > 0.7 ? 1.0 : 0.85);
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: 2.5, sizeAttenuation: false, vertexColors: true, fog: false, depthWrite: false }));
    stars.frustumCulled = false; stars.renderOrder = -1;
    this.el.setObject3D('stars', stars);
    this.player = document.querySelector('#player');
  },
  tick: function () {
    if (this.player) this.el.object3D.position.copy(this.player.object3D.position);
  }
});

// Газовый гигант в дымке: виден над дальней частью пустоты, нижняя часть уходит под пол.
AFRAME.registerComponent('gas-planet', {
  schema: { radius: {default: 10} },
  init: function () {
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#7d604c'); grad.addColorStop(0.45, '#63493b');
    grad.addColorStop(0.75, '#4a3c36'); grad.addColorStop(1.00, '#3a3c42');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
    for (let i = 0; i < 14; i++) {
      g.fillStyle = 'rgba(200,160,125,' + (0.04 + (i % 3) * 0.02) + ')';
      g.fillRect(0, (i * 37) % 440, 4, 6 + (i % 4) * 4);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(this.data.radius, 48, 32),
      new THREE.MeshBasicMaterial({map: tex, fog: false}));
    this.el.setObject3D('mesh', mesh);
  }
});

// Сатурн с кольцом: висит высоко над пустотой, нижняя часть плавно уходит в дымку.
AFRAME.registerComponent('saturn', {
  schema: { radius: {default: 4} },
  init: function () {
    const R = this.data.radius;
    const group = new THREE.Group();
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#c2a57e'); grad.addColorStop(0.50, '#a08266');
    grad.addColorStop(0.80, '#6f5e4c'); grad.addColorStop(1.00, '#3a3c42');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
    for (let i = 0; i < 12; i++) {
      g.fillStyle = 'rgba(240,220,180,' + (0.05 + (i % 3) * 0.03) + ')';
      g.fillRect(0, (i * 41) % 440, 4, 5 + (i % 4) * 3);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    group.add(new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32),
      new THREE.MeshBasicMaterial({map: tex, fog: false})));
    const ring = new THREE.Mesh(new THREE.RingGeometry(R * 1.35, R * 2.1, 128, 1),
      new THREE.MeshBasicMaterial({color: '#cdb48f', transparent: true, opacity: 0.38,
        side: THREE.DoubleSide, fog: false, depthWrite: false}));
    ring.rotation.x = -1.05;
    group.add(ring);
    this.el.setObject3D('mesh', group);
  }
});

// Огромный газовый шар над головой: освещается солнцем и отбрасывает тень на пол.
AFRAME.registerComponent('overhead-planet', {
  schema: { radius: {default: 8} },
  init: function () {
    // Матовый однотонный шар, без полос.
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(this.data.radius, 48, 32),
      new THREE.MeshStandardMaterial({color: '#6e5d52', roughness: 1, metalness: 0}));
    mesh.castShadow = true;
    this.el.setObject3D('mesh', mesh);
  }
});

// Редкие светящиеся частицы для ощущения глубины (сейчас не используются).
AFRAME.registerComponent('dust', {
  schema: { count: {default: 220}, radius: {default: 22} },
  init: function () {
    const n = this.data.count, p = new Float32Array(n * 3);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * this.data.radius;
      p[i*3] = Math.cos(a) * r; p[i*3+1] = 0.3 + rnd() * 6; p[i*3+2] = Math.sin(a) * r;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
    this.el.setObject3D('mesh', new THREE.Points(geo,
      new THREE.PointsMaterial({color: '#7fe8ff', size: 0.045, transparent: true, opacity: 0.7, depthWrite: false})));
  }
});

// Не даёт уйти слишком далеко от центра.
AFRAME.registerComponent('limit-radius', {
  schema: { max: {default: 14} },
  tick: function () {
    const p = this.el.object3D.position, d = Math.hypot(p.x, p.z);
    if (d > this.data.max) { p.x *= this.data.max / d; p.z *= this.data.max / d; }
  }
});
</script>
</head>
<body>
  <a-scene id="scene" background="color: #1c1d22"
           renderer="antialias: true">

    <!-- Освещение: холодный общий свет, тёплый над креслом, голубая подсветка сзади -->
    <a-light type="ambient" color="#8fa0c5" intensity="1.0"></a-light>
    <a-light id="sun" type="directional" position="-6 34 -30" color="#fff4e6" intensity="1.2"></a-light>
    <a-light type="point" position="0 3 -1.5" color="#ffb070" intensity="9" distance="9" decay="2"></a-light>
    <a-light type="point" position="0 1.4 -6" color="#d9a77a" intensity="14" distance="14" decay="2"></a-light>

    <a-entity void-sky></a-entity>
    <a-entity grid-floor></a-entity>
    <a-entity pedestal></a-entity>
    <a-entity orbit-body="index: 0"></a-entity>
    <a-entity orbit-body="index: 1"></a-entity>
    <a-entity orbit-body="index: 2"></a-entity>
    <a-entity orbit-body="index: 3"></a-entity>
    <a-entity orbit-body="index: 4"></a-entity>
    <a-entity orbit-body="index: 5"></a-entity>
    <a-entity orbit-body="index: 6"></a-entity>
    <a-entity orbit-body="index: 7"></a-entity>
    <a-entity orbit-body="index: 8"></a-entity>
    <a-entity orbit-body="index: 9"></a-entity>

    <!-- Предметы галереи создаются из списка GALLERY выше -->
    <a-entity id="gallery"></a-entity>

    <!-- Игрок и VR-камера -->
    <a-entity id="player" position="0 0.9 3.2">
      <a-camera look-controls position="0 0.17 0" fov="70" near="0.1" far="3000">
        <a-plane id="crash-plane" position="0 0 -0.3" width="4" height="3" material="color: #000; opacity: 0; transparent: true; depthTest: false"></a-plane>
      </a-camera>
      <a-entity laser-controls="hand: left" id="left-hand"></a-entity>
      <a-entity laser-controls="hand: right" id="right-hand"></a-entity>
    </a-entity>
  </a-scene>

<script>
// Строим сцену из списка GALLERY.
(function () {
  const root = document.querySelector('#gallery');
  for (const it of GALLERY) {
    const holder = document.createElement('a-entity');
    holder.setAttribute('id', it.id + '-holder');
    holder.setAttribute('position', it.pos.join(' '));
    holder.setAttribute('rotation', '0 ' + (it.rot || 0) + ' 0');
    if (it.scale) holder.setAttribute('scale', it.scale.join(' '));
    const model = document.createElement(it.inst ? 'a-entity' : 'a-gltf-model');
    model.setAttribute('id', it.id);
    if (it.inst) model.setAttribute('instance-glb', 'src: ./' + it.src);
    else model.setAttribute('src', './' + it.src);
    if (it.fit) model.setAttribute('fit-furniture', `axis: ${it.fit[0]}; size: ${it.fit[1]}`);
    holder.appendChild(model);
    root.appendChild(holder);
    if (it.pool) {
      const pool = document.createElement('a-entity');
      pool.setAttribute('position', `${it.pos[0]} 0.01 ${it.pos[2]}`);
      pool.setAttribute('glow-pool', `color: ${it.pool[0]}; radius: ${it.pool[1]*0.8}; opacity: 0.6`);
      root.appendChild(pool);
    }
  }
})();

// Управление Quest: левый стик – движение, правый – поворот на 30°.
AFRAME.registerComponent('thumbstick-movement', {
  init: function () {
    this.axisX = 0;
    this.axisY = 0;
    const leftHand = document.querySelector('#left-hand');
    leftHand.addEventListener('thumbstickmoved', (event) => {
      this.axisX = event.detail.x;
      this.axisY = event.detail.y;
    });
  },
  tick: function (time, delta) {
    if (!this.el.sceneEl.is('vr-mode')) return;
    const deadzone = 0.15;
    const x = Math.abs(this.axisX) > deadzone ? this.axisX : 0;
    const y = Math.abs(this.axisY) > deadzone ? this.axisY : 0;
    if (x === 0 && y === 0) return;
    // В полёте ходьба отключена: управляет только ранец.
    const jet = document.querySelector('#player').components['jetpack-flight'];
    if (jet && (!jet.grounded || jet.nearPlanet)) return;
    const player = document.querySelector('#player');
    const camera = player.querySelector('[camera]');
    const direction = new THREE.Vector3(x, 0, y);
    const rotation = new THREE.Quaternion();
    camera.object3D.getWorldQuaternion(rotation);
    direction.applyQuaternion(rotation);
    // Ходьба по касательной к поверхности, на которой стоишь (пол, планета или многогранник)
    const nUp = jet && jet.grounded ? jet.surfN : new THREE.Vector3(0, 1, 0);
    direction.addScaledVector(nUp, -direction.dot(nUp));
    direction.normalize();
    const speed = 1.5;
    const seconds = Math.min(delta / 1000, 0.05);
    player.object3D.position.addScaledVector(direction, speed * seconds);
  }
});
document.querySelector('#player').setAttribute('thumbstick-movement', '');

AFRAME.registerComponent('snap-turn', {
  init: function () {
    this.ready = true;
    const rightHand = document.querySelector('#right-hand');
    rightHand.addEventListener('thumbstickmoved', (event) => {
      const x = event.detail.x;
      if (Math.abs(x) < 0.3) { this.ready = true; return; }
      if (!this.ready || Math.abs(x) < 0.75) return;
      this.ready = false;
      const angle = x > 0 ? -Math.PI / 6 : Math.PI / 6;
      const jet = this.el.components['jetpack-flight']; if (jet) jet.yaw += angle;
    });
  }
});

// Ранец: гравитация, инерция, тяга по взгляду (как посадочный модуль).
// Тяга: триггер правой руки (на ПК – пробел). Посадка мягкая до 6 м/с, быстрее – разбивается и возвращает на старт.
const GRAVITY = 4.5, THRUST = 9, CRASH_SPEED = 10, START = { x: 0, y: 0.9, z: 3.2 };
// Половины размеров тела: квадрат 0.5 × 0.5 м в основании и 1.8 м в высоту
const BOX = { x: 0.25, y: 0.9, z: 0.25 };
// Большая планета: целый шар радиусом 120 м. Верх шара на PED метров ниже пола комнаты, а пол – диск радиусом 40 м
// на цилиндрическом пьедестале, который уходит в планету. Поверхности не совпадают, поэтому мерцания нет.
// Три спутника вращаются вокруг её центра по наклонным орбитам и проходят над комнатой.
const CAP_A = 40, BIG_R = 120, PED = 3;
const BIG_C = new THREE.Vector3(0, -(BIG_R + PED), 0);
const BODIES = [
  // Юпитер (большая планета), Сатурн, Нептун и Уран: полосы по широте, как у настоящих
  { big: true, r: BIG_R, bands: ['#c8a27a', '#e8d3b0', '#a8724a', '#d9b48a', '#8c5a3a', '#e2c49a'], spin: 0.04, g: 4.5 },
  { moon: true, r: 28, bands: ['#e3cf9c', '#f0e2bc', '#d8c08a'], orbit: 200, phase: 2.2, period: 150, spin: 0.25, g: 4.5 },
  { moon: true, r: 12, bands: ['#3f6fb0', '#5a8ad0', '#2d55a0'], orbit: 250, phase: 0.6, period: 220, spin: 0.5, g: 4.5 },
  { moon: true, r: 18, bands: ['#9ad6dc', '#b4e3e6', '#86c5cc'], orbit: 300, phase: 4.0, period: 320, spin: -0.35, g: 4.5 },
  // Платоновы тела и пентакисдодекаэдр: огромные обелиски (радиус 60 м) на орбитах 450–600 м, светятся рёбрами.
  // Куб – чёрный с красными рёбрами, остальные – тёмные с голубыми рёбрами. Блеск – от карты окружения.
  { poly: 'tetra', size: 60, edge: '#18e0ff', face: '#5b6578', orbit: 450, phase: 0.0, period: 260, spin: 0.05, g: 2, ty: 0.95, tz: 0.3 },
  { poly: 'cube', size: 60, edge: '#ff2a2a', face: '#33363f', orbit: 520, phase: 2.1, period: 300, spin: -0.04, g: 2, ty: 0.6, tz: 0.8 },
  { poly: 'octa', size: 60, edge: '#18e0ff', face: '#5b6578', orbit: 580, phase: 4.2, period: 340, spin: 0.06, g: 2, ty: 0.85, tz: -0.5 },

    this.thrusting = false;
    this.vel.set(0, 0, 0);
    this.plane.setAttribute('material', 'opacity', 1);
    setTimeout(() => {
      this.el.object3D.position.set(START.x, START.y, START.z);
      this.grounded = true;
      this.carrier = -1;
      this.plane.setAttribute('material', 'opacity', 0);
      this.crashing = false;
    }, 700);
  }
});
document.querySelector('#player').setAttribute('jetpack-flight', '');
</script>

<script>
(function () {
  const scene = document.querySelector('#scene');
  const enable = () => {
    const r = scene.renderer; if (!r) return;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    const sun = document.querySelector('#sun').getObject3D('light');
    if (sun) {
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      const cam = sun.shadow.camera;
      cam.left = -45; cam.right = 45; cam.top = 45; cam.bottom = -45; cam.near = 5; cam.far = 120;
      cam.updateProjectionMatrix();
      sun.shadow.bias = -0.0008;
    }
    // Тень отбрасывают только шар; пол её принимает. Мебель не отбрасывает тени, чтобы не грузить Квест.
  };
  if (scene.hasLoaded) enable(); else scene.addEventListener('loaded', enable);
})();
</script>
</body>
</html>
